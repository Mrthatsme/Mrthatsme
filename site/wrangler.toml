name = "minutesregained"
main = "src/worker.js"
compatibility_date = "2026-10-06"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Brief to support@ every day at 8 AM and 8 PM Eastern. Fires at both
# candidate UTC hours; the Worker sends only the one that is 8 o'clock
# Eastern, so it stays right across daylight-saving changes.
[triggers]
crons = ["0 0,1,12,13 * * *"]

[vars]
# support@minutesregained.com is the only business address used anywhere
# in this app, per explicit instruction -- do not switch this back to a
# personal address. NOTE: delivery here depends on the minutesregained.com
# domain being verified in Resend (DNS records added, pending Cloudflare
# DNS edit permission on the token as of this writing). Until verified,
# sends to this address will fail -- that failure is caught and logged on
# the lead record (never lost), it just won't reach an inbox yet.
NOTIFY_EMAIL = "support@minutesregained.com"
TRIAGE_DAILY_CAP = "50"

[[d1_databases]]
binding = "DB"
database_name = "minutesregained-crm"
database_id = "32f3847f-7e15-445b-83cf-99b70969214c"
